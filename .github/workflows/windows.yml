# Builds the Crispy companion daemon for Windows on every push/PR and
# attaches the installer and the no-installer zip to tagged releases (v*),
# mirroring packaging/windows/README.md:
#
#   crispy-companion.exe   the daemon (Go, no cgo)
#   torrserver.exe         pinned MatriX.146.1 artefact, sha256-checked
#   crispy-companion-windows-amd64-setup.exe
#                           per-user NSIS installer (no admin): payload,
#                           Start Menu entry, seed config, uninstaller
#   crispy-companion-windows-amd64.zip
#                           the same files for a folder install without one
#
# The setup.exe is then exercised for real: a third job installs it silently
# on a clean Windows runner, checks exactly what it laid down, starts the
# installed daemon, and uninstalls it again. Compiling an installer proves
# nothing about whether it installs.
#
# This is the first platform workflow that actually runs the daemon on its
# target OS: the tests and the smoke test run on a Windows runner, and the
# smoke test proves the HKCU autostart registration end to end (the same
# thing the macOS smoke test proves for the LaunchAgent).

name: Windows

on:
  push:
    branches: [main, microslop-windows]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # release job needs this to attach artifacts

jobs:
  test:
    name: Go tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    name: companion, engine, installer
    needs: test
    runs-on: windows-latest
    env:
      TORRSERVER_VERSION: MatriX.146.1
      TORRSERVER_SHA_AMD64: ac2bbda1d89230739306ae733fd29777b2fceb7f560702fca96b757ab267c2ff
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Inject deployment defaults
        # Same secrets as the other builds: release installers phone home to
        # our server and trust our web origin out of the box. Fork/PR builds
        # keep fail-closed OSS defaults.
        env:
          CRISPY_SERVER_URL: ${{ secrets.CRISPY_SERVER_URL }}
          CRISPY_ALLOWED_ORIGINS: ${{ secrets.CRISPY_ALLOWED_ORIGINS }}
          CRISPY_WEBAPP_URL: ${{ secrets.CRISPY_WEBAPP_URL }}
        run: bash scripts/builddefaults.sh
      - name: Build the companion
        # windows-latest runs pwsh unless a step says otherwise, and every
        # bash-flavoured step below states it.
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --tags --always --dirty 2>/dev/null || echo 0.1.0-dev)"
          ldflags="-s -w -X github.com/crispy-streaming/crispy-companion/internal/server.Version=$version"
          # The installer's version resource takes three numeric fields only,
          # so a tag like v0.1.0 (or v1.2.3-rc1) gives 0.1.0 / 1.2.3 and
          # everything else (branches, PRs, shas) keeps the 0.1.0 fallback.
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "CRISPY_VERSION=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
          else
            echo "CRISPY_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o crispy-companion.exe ./cmd/crispy-companion
      - name: Fetch the pinned TorrServer engine
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/YouROK/TorrServer/releases/download/$TORRSERVER_VERSION"
          curl -fsSLo torrserver.exe "$base/TorrServer-windows-amd64.exe"
          echo "$TORRSERVER_SHA_AMD64  torrserver.exe" | sha256sum -c -
      - name: Stage the payload
        # The installer picks its files up from packaging/windows/stage, the
        # default staging dir baked into the .nsi.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/windows/stage/icons
          cp crispy-companion.exe packaging/windows/stage/
          cp torrserver.exe packaging/windows/stage/
          cp packaging/windows/config.toml packaging/windows/stage/
          cp packaging/windows/icons/crispy-companion.ico packaging/windows/stage/icons/
      - name: Smoke-run the daemon on Windows (autostart registration)
        # Proves the Windows path end to end on a real Windows host: the
        # daemon writes the HKCU Run value itself via reg.exe, pointing at
        # its own exe plus --autostart-run, and records the outcome in
        # autostart.json. Run from the staging dir so torrserver.exe is
        # found next to the binary, exactly as the installer ships them.
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/crispy-winsmoke"
          CRISPY_COMPANION_DATA_DIR="$data" packaging/windows/stage/crispy-companion.exe &
          served=""
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11470/companion/ping >/dev/null 2>&1; then
              served=1
              break
            fi
            sleep 1
          done
          if [ -z "$served" ]; then
            echo "::error::the daemon never answered /companion/ping"
            cmd //c "taskkill /F /IM crispy-companion.exe" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:11470/companion/ping | grep -q '"name":"crispy-companion"' || {
            echo "::error::/companion/ping did not answer as crispy-companion"
            exit 1
          }
          # The registration happens right after the listeners come up.
          sleep 3
          # Read the value through PowerShell: reg.exe's /v switch is a bare
          # slash option, and Git bash rewrites those into Windows paths (the
          # same reason the taskkill calls above go through cmd //c).
          run_data="$(powershell -NoProfile -Command "(Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Crispy Companion').'Crispy Companion'" 2>/dev/null || true)"
          echo "Run value: ${run_data}"
          grep -q -- "--autostart-run" <<<"$run_data" || { echo "::error::the Run value was not written"; exit 1; }
          grep -q '"enabled": true' "$data/autostart.json" || { echo "::error::autostart.json does not record the registration"; exit 1; }
          # Force-kill: Windows has no SIGTERM for this smoke test, and the
          # engine would otherwise keep running behind a dead daemon.
          cmd //c "taskkill /F /IM crispy-companion.exe" || true
          cmd //c "taskkill /F /IM torrserver.exe" || true
      - name: Build the installer (NSIS, per-user)
        uses: nsis-dev/setup-nsis@v1
      - name: Compile the installer
        shell: bash
        run: |
          set -euo pipefail
          # /NOCD keeps makensis in the workspace root: the script's payload,
          # icon and LICENSE paths are relative to it, and without the switch
          # makensis cds into packaging/windows and every path doubles.
          # -DSTAGEDIR defaults to packaging/windows/stage; the version
          # resource needs three numeric fields (see the build step).
          makensis -NOCD -DVERSION="${CRISPY_VERSION}" \
                   -DOUTFILE=crispy-companion-windows-amd64-setup.exe \
                   packaging/windows/crispy-companion.nsi
          test -f crispy-companion-windows-amd64-setup.exe
      - name: Zip the no-installer layout
        # Flat like the installer's install dir: staging keeps the icon in an
        # icons\ subfolder, so the zip is built from a flat copy rather than
        # compressing the staging tree as-is.
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "crispy-zip"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item crispy-companion.exe $root
          Copy-Item packaging\windows\stage\torrserver.exe $root
          Copy-Item packaging\windows\stage\config.toml $root
          Copy-Item packaging\windows\stage\icons\crispy-companion.ico $root
          Copy-Item LICENSE "$root\LICENSE.txt"
          Copy-Item packaging\windows\README.md $root
          Compress-Archive -Path "$root\*" -DestinationPath crispy-companion-windows-amd64.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: crispy-companion-windows
          path: |
            crispy-companion-windows-amd64-setup.exe
            crispy-companion-windows-amd64.zip

  install-test:
    name: Install and uninstall the installer
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          name: crispy-companion-windows
          path: installer
      - name: Check the no-installer zip layout
        # The zip is the documented "just extract it" fallback, so its file
        # list is part of the release contract, not an implementation detail.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'installer\crispy-companion-windows-amd64.zip'
          $out = Join-Path $env:RUNNER_TEMP 'crispy-zip'
          Expand-Archive -Path $zip -DestinationPath $out -Force
          foreach ($f in 'crispy-companion.exe', 'torrserver.exe', 'config.toml', 'crispy-companion.ico', 'LICENSE.txt', 'README.md') {
            if (-not (Test-Path (Join-Path $out $f))) { Write-Output "::error::the zip is missing $f"; exit 1 }
          }
          Write-Output 'zip layout is flat and complete'
      - name: Install, verify, uninstall, verify
        # PowerShell, not bash: the silent switches are slash-prefixed and Git
        # bash would rewrite them into Windows paths (the trap the smoke test
        # hit with reg.exe /v). /S is NSIS silent mode, and both the installer
        # and the uninstaller take it.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer\crispy-companion-windows-amd64-setup.exe'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Crispy Companion'
          $data = Join-Path $env:LOCALAPPDATA 'Crispy Companion'
          $link = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Crispy Companion.lnk'
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Crispy Companion'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $exe = Join-Path $dir 'crispy-companion.exe'

          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error::the installer exited $($p.ExitCode)"; exit 1 }

          # What the installer is documented to lay down, and nothing else.
          foreach ($f in 'crispy-companion.exe', 'torrserver.exe', 'config.toml', 'crispy-companion.ico', 'LICENSE.txt', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Output "::error::installed file is missing: $f"; exit 1 }
          }
          if (-not (Test-Path $link)) { Write-Output '::error::the Start Menu entry was not created'; exit 1 }
          $uninstItem = Get-Item -Path $uninstKey -ErrorAction SilentlyContinue
          if ($null -eq $uninstItem -or $uninstItem.GetValue('DisplayName') -ne 'Crispy Companion') {
            Write-Output '::error::the Programs entry was not written'; exit 1
          }
          if (-not (Test-Path (Join-Path $data 'config.toml'))) { Write-Output '::error::the seed config did not reach the data dir'; exit 1 }
          # Get-ItemProperty cannot be used here: a value that does not exist
          # still yields a truthy property object. And on a pristine runner the
          # Run key itself does not exist until the daemon writes it, so both
          # the key and the value are read defensively.
          function Get-AutostartValue {
            $key = Get-Item -Path $runKey -ErrorAction SilentlyContinue
            if ($null -eq $key) { return $null }
            return $key.GetValue('Crispy Companion')
          }
          if ($null -ne (Get-AutostartValue)) {
            Write-Output '::error::the installer wrote autostart, which is the daemon''s job'; exit 1
          }

          # The installed binary must serve, and register its own autostart --
          # the same thing the smoke test proves for the staged copy.
          $env:CRISPY_COMPANION_DATA_DIR = $data
          Start-Process -FilePath $exe -PassThru | Out-Null
          $served = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { (Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:11470/companion/ping').Content | Out-Null; $served = $true; break } catch {}
          }
          if (-not $served) { taskkill /F /IM crispy-companion.exe 2>$null | Out-Null; Write-Output '::error::the installed daemon never answered the ping'; exit 1 }
          Start-Sleep -Seconds 3
          $run = Get-AutostartValue
          if ($run -notlike '*--autostart-run*') { Write-Output '::error::the installed daemon did not write the HKCU Run value'; exit 1 }
          taskkill /F /IM crispy-companion.exe 2>$null | Out-Null
          taskkill /F /IM torrserver.exe 2>$null | Out-Null

          # And nothing may survive an uninstall.
          $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Output "::error::the uninstaller exited $($u.ExitCode)"; exit 1 }
          foreach ($f in 'crispy-companion.exe', 'torrserver.exe', 'config.toml', 'crispy-companion.ico', 'LICENSE.txt', 'uninstall.exe') {
            if (Test-Path (Join-Path $dir $f)) { Write-Output "::error::the uninstaller left $f behind"; exit 1 }
          }
          if (Test-Path $link) { Write-Output '::error::the Start Menu entry survived the uninstall'; exit 1 }
          if ($null -ne (Get-Item -Path $uninstKey -ErrorAction SilentlyContinue)) { Write-Output '::error::the Programs entry survived the uninstall'; exit 1 }
          # Re-read: the values above were captured before the uninstall, and
          # the Run key the daemon created is gone again by now.
          if ($null -ne (Get-AutostartValue)) { Write-Output '::error::the autostart Run value survived the uninstall'; exit 1 }
          if (Test-Path $data) { Write-Output '::error::the data dir survived the uninstall'; exit 1 }
          Write-Output 'install, daemon, autostart and uninstall all verified'

  release:
    name: Attach artifacts to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: crispy-companion-windows-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: crispy-companion-windows-*
