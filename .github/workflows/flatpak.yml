# Builds the Flatpak (Flathub-style) on every push/PR and attaches
# per-arch .flatpak bundles to tagged releases (v*).
#
# Manifest: packaging/flatpak/io.crispy.Companion.json
#   - Go is vendored (GOFLAGS=-mod=vendor, CGO_ENABLED=0): no network at build.
#   - TorrServer engine binaries are SHA256-pinned per arch (MatriX.146.1).
name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # release job needs this to attach bundles

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  flatpak:
    name: Flatpak (${{ matrix.variant.arch }})
    needs: test
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Inject deployment defaults
        # Writes internal/config/builddefaults_gen.go (gitignored) so release
        # bundles phone home to our server and trust our web origin out of
        # the box. Values come from these repository secrets, falling back to
        # a local .env (see .env.example); fork/PR builds have neither and
        # keep fail-closed OSS defaults. A config file or env vars on the
        # user's machine always override these compiled-in values.
        env:
          CRISPY_SERVER_URL: ${{ secrets.CRISPY_SERVER_URL }}
          CRISPY_ALLOWED_ORIGINS: ${{ secrets.CRISPY_ALLOWED_ORIGINS }}
        run: bash scripts/builddefaults.sh
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: crispy-companion-${{ matrix.variant.arch }}.flatpak
          manifest-path: packaging/flatpak/io.crispy.Companion.json
          arch: ${{ matrix.variant.arch }}
          verbose: true
          artifact-name: crispy-companion-${{ matrix.variant.arch }}.flatpak

  release:
    name: Attach bundles to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: crispy-companion-*.flatpak
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: crispy-companion-*.flatpak
