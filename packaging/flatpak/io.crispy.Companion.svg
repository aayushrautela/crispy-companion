<?xml version="1.0" encoding="UTF-8"?>
<!--
  Crispy Companion app icon.

  Same artwork as the Crispy web app brand mark (black disc, red play wedge,
  white outlined chevron). Geometry is taken from the brand artwork in the
  Crispy web app: the red wedge and the white chevron are the two paths of
  the app's favicon.svg, scaled 5.16x onto a 512x512 canvas so the disc is
  inset-free and the mark keeps its proportions.

  Rules for this file (see packaging/flatpak/README.md):
    - square viewBox, transparent outside the disc
    - no external references, no embedded raster, no font-dependent text
    - icon name must stay io.crispy.Companion (it equals the app ID)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Crispy Companion">
  <title>Crispy Companion</title>
  <circle cx="256" cy="256" r="256" fill="#000000"/>
  <g transform="translate(108 77.48) scale(5.1698)">
    <path d="M0 0V50L43 25L0 0Z" fill="#E11D48"/>
    <path d="M10 15V65L53 40L10 15Z" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
